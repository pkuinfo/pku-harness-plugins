# api.rs search: GET /chapi/api/v3/hole/list?keyword=… → { list: [hole] } (no comments).
title: 搜索树洞
summary: 按关键词搜索树洞帖子
description: 'Search holes by keyword (api.rs search: hole/list?keyword=). Returns holes without comments; read one with treehole__read.'
effect: read
untrusted: true
input:
  keyword: { type: string, trim: true, min: 1, max: 50 }
  page: { type: integer, min: 1, max: 50, default: 1, description: default 1 }
  limit: { type: integer, min: 1, max: 30, default: 10, description: default 10 }
  code: { type: string, optional: true, trim: true, min: 4, max: 8, description: 'SMS code, only when a previous call returned verification_required' }
steps:
  - let: data
    value: "null"
  - try:
      - let: data
        ability: verify.treehole
        args: "{ request: { url: '/chapi/api/v3/hole/list?keyword=' + encode(input.keyword) + '&page=' + input.page + '&limit=' + input.limit }, code: input.code, via: 'sms', kind: 'login' }"
    catch:
      - check: "false"
        error: "${failure(error.message)}"
  - if: "obj(data).status == 'verification_required'"
    then:
      - return: VERIFY
  - check: hasList(data)
    error: 树洞返回的数据缺少帖子列表
return: "{ status: 'ok', keyword: input.keyword, page: input.page, note: UNTRUSTED, holes: data.list.map(v => hole(parseHole(v), 500)) }"
