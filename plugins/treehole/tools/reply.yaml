# commands.rs cmd_reply: POST /chapi/api/v3/comment/post { pid, text, anonymous: 1, comment_id? }.
title: 回复树洞
summary: 以你的匿名身份公开回复一个帖子（需你确认原文）
description: "PUBLISH a public comment on a hole under the user's anonymous identity (commands.rs cmd_reply: comment/post, anonymous). quoteCid replies to a specific comment. Only when the user explicitly asked and confirmed this exact text."
effect: public
input:
  pid: { type: integer, min: 1, description: 'hole id (the number after #)' }
  text: { type: string, trim: true, min: 1, max: 2000, description: the exact text the user approved }
  quoteCid: { type: integer, min: 1, optional: true, description: cid of the comment to reply to }
  code: { type: string, optional: true, trim: true, min: 4, max: 8, description: 'SMS code, only when a previous call returned verification_required' }
steps:
  - let: r
    value: "null"
  - try:
      - let: r
        ability: verify.treehole
        args: "{ request: { url: '/chapi/api/v3/comment/post', method: 'POST', json: { pid: input.pid, text: input.text, anonymous: 1, ...(input.quoteCid ? { comment_id: input.quoteCid } : {}) } }, code: input.code, via: 'sms', kind: 'login' }"
    catch:
      - check: "false"
        error: "${failure(error.message)}"
  - if: "obj(r).status == 'verification_required'"
    then:
      - return: VERIFY
return: "{ status: 'posted', pid: input.pid }"
