# commands.rs cmd_post: POST /chapi/api/v3/hole/post { text, type: text, anonymous: 1, fold, reward_cost: 0 } → data { pid }.
title: 发布树洞
summary: 以你的匿名身份公开发一条树洞（需你确认原文）
description: "PUBLISH a new hole on the PKU Treehole, visible to every PKU user, under the user's anonymous identity (commands.rs cmd_post: hole/post, type text, anonymous). Only when the user explicitly asked to post and confirmed this exact text; never write it on your own."
effect: public
input:
  text: { type: string, trim: true, min: 1, max: 5000, description: the exact text the user approved }
  fold: { type: boolean, optional: true, description: 'fold the hole (折叠, for sensitive content); default false' }
  code: { type: string, optional: true, trim: true, min: 4, max: 8, description: 'SMS code, only when a previous call returned verification_required' }
steps:
  - let: data
    value: "null"
  - try:
      - let: data
        ability: verify.treehole
        args: "{ request: { url: '/chapi/api/v3/hole/post', method: 'POST', json: { text: input.text, type: 'text', anonymous: 1, fold: input.fold ? 1 : 0, reward_cost: 0 } }, code: input.code, via: 'sms', kind: 'login' }"
    catch:
      - check: "false"
        error: "${failure(error.message)}"
  - if: "obj(data).status == 'verification_required'"
    then:
      - return: VERIFY
return: "{ status: 'posted', pid: n(data, 'pid') || null }"
