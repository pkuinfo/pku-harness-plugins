# The cancel page has no list: /classRoom is read; the record is gone.
tool: cancel
input:
  id: "1234567"
responses:
  - match: /classRoom/cancelApply/1234567
    campus: bdkj
    url: https://bdkj.pku.edu.cn/classRoom
    body: <html><script>layer.msg("取消成功")</script></html>
  - match: /classRoom
    campus: bdkj
    file: applications-empty.html
expect:
  cancelled: true
  id: "1234567"
  status: 申请已取消
