title: 保存参与人分组
summary: 把一组参与人存成分组，预约时直接用
description: Save (or replace) a named participant group on this device, for reuse in room-booking__reserve. Members only as given by the user.
effect: write
input:
  name: { type: string, trim: true, min: 1, max: 20 }
  members: { type: array, items: { type: object }, min: 1, max: 30, description: '[{ serial: 学号, name: 姓名 }]' }
steps:
  - check: "!memberIssue(input.members)"
    error: ${memberIssue(input.members)}
  - let: groups
    kv: get
    key: groups
    legacy: true
  - kv: set
    key: groups
    value: "merge(groups ?? {}, fromEntries([[input.name, cleanMembers(input.members)]]))"
return: "{ saved: input.name, members: length(input.members) }"
