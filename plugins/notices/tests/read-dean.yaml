  url: https://dean.pku.edu.cn/web/notice_details.php?id=768
  title: 关于校本部2026级本科新生填写学籍表的通知
  date: 2026-10-13
  source: null
  text: |-
    校本部2026级本科新生（含2025年保留入学资格、2026年重新入学的本科生）：

    自即日起至2026年10月25日，请全体新生登陆校内综合信息门户（portal.pku.edu.cn）填写学籍表并核对个人基本信息。具体要求如下：

    1、登陆校内综合信息门户，点击“教务部业务”——“填写学籍表”。

    2、填写说明：

    如学籍表上未显示照片，请联系教务部教务办公室（电话：62751432）；

    最后学历和时间请填写入读北京大学前的学历，以实际情况为准；

    家庭通信地址请填写家庭目前的详细住址、邮政编码（学生在校期间学校与家庭联系以此通讯地址为准，如有变更请及时更正）；

    个人简历请从初中开始填写；

    家庭主要成员请填写父母、兄弟姐妹等成员，联系电话一定要填写；

    本人手机号和邮箱务必要填写准确；

    填完检查无误，请务必点击“提交”。

    3、学生填完学籍表后，由院系通知交表时间。学籍表打印两份，本人签字后把表格交给所在院系本科教务。

    4、院系收齐盖好院系公章的学籍表（请确认务必填写完整、系统提交、本人签字、照片齐全）于10月30日前交到教务部教务办公室（燕园大厦1217室）。

    5、请仔细核对姓名、性别、出生日期、身份证号、生源地和民族信息，如与本人情况不一致：

    (1)中国大陆籍和港澳台籍学生请联系教务部教务办公室（电话：62751432）并提交相应证明材料。

    (2)港澳台学生，请注意：

    姓名请与港澳居民来往内地通行证、台湾居民来往大陆通行证、中华人民共和国港澳台居民居住证等证件保持一致；

    证件类型及证件号请与港澳居民来往内地通行证、台湾居民来往大陆通行证、中华人民共和国港澳台居民居住证等证件保持一致。

    (3)留学生如信息与本人实际信息不一致，请联系留学生办公室（电话：62751116或62767063）并提交相应证明材料。

    教务部

    2026年10月13日
