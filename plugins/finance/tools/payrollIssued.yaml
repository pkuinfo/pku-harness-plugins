# 薪酬劳务查询, payer / project view (pkucli crates/cwfw queries.rs; window 7320, form 7181,
# grid 7183). Usually empty for students.
title: 薪酬劳务查询（经办）
summary: 从你负责的项目发出的酬金（项目负责人视角）
description: >-
  Payments issued from projects the user manages or handled (薪酬劳务查询, payer view; usually empty for students): date, voucher, summary, project, payee name, personType, gross / amount (yuan), method. kind: 0 学生发放, 1 薪酬劳务, 2 奖助学金, 3 合同制工资, 4 博士后工资, 5 研究技术系列人员工资. ID numbers, bank cards and staff numbers are never returned; payee names are other people's data, do not pass them on. Sensitive personal data: call only when the user asks, answer only what was asked, and never put the amounts on the dashboard, in notifications, memory or other plugins unless the user explicitly asks. Works only on the PKU campus network.
effect: read
input:
  kind: { enum: [0, 1, 2, 3, 4, 5], optional: true, description: default 1 (薪酬劳务) }
  since: { type: string, optional: true, pattern: '^\d{4}-\d{2}-\d{2}$', description: YYYY-MM-DD; default Jan 1 this year }
  until: { type: string, optional: true, pattern: '^\d{4}-\d{2}-\d{2}$', description: YYYY-MM-DD; default today }
  project: { type: string, optional: true, max: 30, description: project code filter }
constants:
  PAYROLL_KINDS: { '0': 学生发放, '1': 薪酬劳务, '2': 奖助学金, '3': 合同制工资, '4': 博士后工资, '5': 研究技术系列人员工资 }
functions:
  # Grid 7183: ym, pz_unino, sabstract, prj_code, prj_name, j_amount, sno, cercode_name, personid,
  # card, branchname, sname, m_name, sk_amt, ff_type, …. Staff/student numbers, ID numbers, bank
  # cards and bank names are never returned.
  payroll: |
    (r) => ({
      date: dateOnly(cell(r, 0)),
      voucher: cell(r, 1),
      summary: cell(r, 2),
      projectCode: cell(r, 3),
      projectName: cell(r, 4),
      amount: amount(cell(r, 5)),
      payee: cell(r, 11),
      personType: cell(r, 12),
      gross: amount(cell(r, 13)),
      method: cell(r, 14),
    })
steps:
  - let: end
    value: input.until ?? today()
  - let: start
    value: "input.since ?? thisYear() + '-01-01'"
  - check: start <= end
    error: 起始日期 ${start} 不能晚于结束日期 ${end}
  - let: k
    value: input.kind ?? 1
  # openCwbs: userContext from loadRolesMenu (+ loadInitFunction, best effort).
  - let: menu
    request:
      campus: cwfw
      url: '${CWFW}/WF_CWBS/loadRolesMenu.action'
      method: POST
      contentType: '${FORM}'
      headers: { x-requested-with: XMLHttpRequest }
      body: ''
    as: response
  - check: menu.status < 400
    error: 财务门户返回 HTTP ${menu.status}（loadRolesMenu.action）
  - let: ctx0
    value: parseUserContext(menu.text)
  - check: ctx0 != null
    error: 财务门户会话未建立（没有拿到用户信息），请稍后重试
  - let: init
    value: "{}"
  - try:
      - let: initText
        request:
          campus: cwfw
          url: '${CWFW}/WF_CWBS/loadInitFunction.action'
          method: POST
          contentType: '${FORM}'
          headers: { x-requested-with: XMLHttpRequest }
          body: ''
        as: text
      - let: init
        value: initVars(initText)
    catch: []
  - let: uid
    value: uidOf(ctx0)
  - check: uid != ''
    error: 财务门户没有返回学号/工号
  - let: base
    value: "merge(ctx0, init, { '0-USERINFO.USERID': uid, '0-UNINO': uid })"
  - let: defRes
    request:
      campus: cwfw
      url: '${CWFW}/WF_CWBS/loadDefinition.action'
      method: POST
      contentType: '${FORM}'
      headers: "${wfHeaders('WF_CWBS')}"
      body: "${loadWindow(uid, '7320')}"
    as: response
  - check: defRes.status < 400
    error: 财务门户返回 HTTP ${defRes.status}（loadDefinition.action）
  - let: proc
    value: findProc(defRes.text, '7181-t.stype')
  - check: proc != null
    error: 没能解析财务门户的查询页面（系统可能已改版）
  - let: form
    value: "[['t.stype', str(k)], ['t.startdate', start], ['t.sno', ''], ['t.sname', ''], ['t.prjcode', input.project ?? ''], ['t.enddate', end]]"
  - let: ctx
    value: seedForm(base, 'WF_CWBS', '7181', form, 246)
  - let: btn
    request:
      campus: cwfw
      url: '${CWFW}/WF_CWBS/commonUpdate_responseButtonEvent.action'
      method: POST
      contentType: '${FORM}'
      headers: "${wfHeaders('WF_CWBS')}"
      body: "${buttonBody(uid, proc.hash, buildArgs(proc.params, form, ctx), ctx)}"
    as: response
  - check: btn.status < 400
    error: 财务门户返回 HTTP ${btn.status}（commonUpdate_responseButtonEvent.action）
  - check: buttonOk(trim(btn.text))
    error: ${refused(trim(btn.text))}
  - let: q
    request:
      campus: cwfw
      url: '${CWFW}/WF_CWBS/commonQuery_doQuery.action'
      method: POST
      contentType: '${FORM}'
      headers: "${wfHeaders('WF_CWBS')}"
      body: "${doQueryBody(uid, '7183', 'ccd.ym ASC, ccd.pz_unino ASC', 2000)}"
    as: response
  - check: q.status < 400
    error: 财务门户返回 HTTP ${q.status}（commonQuery_doQuery.action）
  - check: gridErr(q.text) == null
    error: ${gridErr(q.text)}
  - let: records
    value: "map(filter(gridRows(q.text), (r) => !isTotal(r)), (r) => payroll(r))"
return: |
  {
    kind: PAYROLL_KINDS[k],
    range: start + '..' + end,
    count: length(records),
    records: slice(records, 0, 200),
    truncated: length(records) > 200,
  }
