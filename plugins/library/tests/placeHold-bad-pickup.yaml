# placeHold-bad-pickup
tool: placeHold
input:
  id: REC0001
  pickup: 火星
now: 2026-10-20 12:00
responses:
  - match: cat_marc=REC0001
    file: holdings.json
  - match: advisePickupAt
    campus: library
