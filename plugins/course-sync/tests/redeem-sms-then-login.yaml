# The SMS course code redeems, but the table then asks for the login SMS check.
tool: sync
input: { code: "123456", method: sms }
kv: { 'verify:pending': course }
responses:
  - { match: /chapi/api/course/mobile_message_get_token, campus: treehole, body: { code: 20000, success: true } }
  - { match: /chapi/api/getCoursetable_v2, campus: treehole, body: { code: 40002, success: false, message: 请进行短信验证 } }
expect: {"status":"verification_required","kind":"login","methods":["sms"],"message":"树洞需要短信验证（首次登录或定期验证）","next":"Ask the user for the code (send an SMS first with the sendCode tool if they choose SMS), then call this tool again with code."}
