# utilities/tools.ts payProjects (api.ts listProjects).
title: 收费平台缴费项目
summary: 收费平台目前开放的在线缴费项目
description: 'Payment items currently open on the PKU payment platform (收费平台 cwpay.pku.edu.cn): name, category and kind (tuition, bath card, network fee, campus card, …). Use to answer "what can I pay online".'
effect: read
# One list request plus up to 60 folders.
limits: { requests: 70 }
steps:
  # utilities/api.ts listProjects: top-level projects plus one level of folders (the 更多应用
  # page). Every folder (the platform has dozens; a cap hid 浴卡充值 when it sat in a later
  # folder), up to 60; a folder that fails is skipped. Two `each` steps: one takes at most 50.
  - let: init
    request:
      campus: cwpay
      url: "${'pay/pay/cos/merchant/getProjectTypeAndProjectInfoListInit/' + SCHOOL}"
      method: GET
      contentType: '${JSON_CT}'
    as: response
  - check: payErr(init, '缴费项目') == null
    error: ${payErr(init, '缴费项目')}
  - let: folders
    value: slice(foldersIn(payData(init) ?? []), 0, 60)
  - let: nestedA
    each: slice(folders, 0, 50)
    concurrency: 4
    steps: &folder
      - let: got
        value: "[]"
      - try:
          - let: r
            request:
              campus: cwpay
              url: "${'pay/pay/cos/merchant/getProjectTypeAndProjectInfoList/' + item.id}"
              method: GET
              contentType: '${JSON_CT}'
            as: response
          - let: got
            value: "payErr(r, '缴费项目') == null ? projectsIn([{ children: payData(r) ?? [] }], item.category) : []"
        catch: []
    return: got
  - let: nestedB
    each: slice(folders, 50, 60)
    concurrency: 4
    steps: *folder
    return: got
  - let: projects
    value: concat(projectsIn(payData(init) ?? [], ''), flat(nestedA), flat(nestedB))
return: "{ count: length(projects), projects: map(projects, (p) => ({ name: p.name, category: p.category, kind: PROJECT_KINDS[p.kind] ?? p.kind ?? null })) }"
