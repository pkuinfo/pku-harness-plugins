# The card centre's rule (getConflictInfo, real text from 2026-11-08), quoted as is.
tool: cardMode
responses:
  - match: useCard/getUseCardConfig
    campus: card
    body:
      code: 200
      success: true
      data:
        cardType: "2"
        cardTypes:
          - name: 校园卡
            code: 0
          - name: 数字卡
            code: 1
          - name: NFC卡
            code: 2
  - match: ykt/tsm/queryCard
    campus: card
    body:
      code: 200
      success: true
      data:
        card:
          - sno: "2000012345"
            name: 张三
            account: "123456"
            lostflag: 0
            freezeflag: 0
            expdate: "20300701"
            elec_accamt: 12345
            accinfo:
              - balance: 12345
                name: 电子钱包
                type: "001"
                daycostamt: 1250
                daycostlimit: 20000
  - match: cardConflict/getConflictInfo?fromaccount=123456&flag=1
    campus: card
    body:
      code: 200
      success: true
      data:
        status: "0"
        message: <p>您今天已经选择了使用NFC卡，数字卡已无法使用。 如确需变更当日用卡方式，可点击"常用卡设置"修改当前用卡方式，或者本人持校园卡及绑定手机，到校园卡中心人工窗口办理相关手续。</p>
expect:
  current: NFC卡
  modes:
    - name: 校园卡
      code: 0
      current: false
    - name: 数字卡
      code: 1
      current: false
    - name: NFC卡
      code: 2
      current: true
  notice: 您今天已经选择了使用NFC卡，数字卡已无法使用。 如确需变更当日用卡方式，可点击"常用卡设置"修改当前用卡方式，或者本人持校园卡及绑定手机，到校园卡中心人工窗口办理相关手续。
