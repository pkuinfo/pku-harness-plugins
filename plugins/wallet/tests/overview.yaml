# hub.tsx: each part loads on its own; a failing part carries its error and the rest still show.
tool: overview
responses:
  - match: ykt/tsm/queryCard
    campus: card
    body:
      code: 200
      success: true
      data:
        card:
          - sno: "2000012345"
            name: 张三
            account: "123456"
            lostflag: 0
            freezeflag: 0
            expdate: "20300701"
            elec_accamt: 12345
            accinfo:
              - balance: 12345
                name: 电子钱包
                type: "001"
                daycostamt: 1250
                daycostlimit: 20000
  - match: itsUtil?operation=info
    campus: its
    body: <html>请登录</html>
  - match: getProjectTypeAndProjectInfoListInit/10001
    campus: cwpay
    body:
      messageCode: "0"
      message: 成功
      data:
        - id: t1
          name: 学生缴费
          children:
            - id: p-tuition
              projectName: 学费住宿费
              proModelUrl: tuitionAndDorm
              type: "0"
            - id: f-more
              name: 其他
              type: "1"
        - id: t2
          name: <b>生活服务</b>
          children:
            - id: p-net
              projectName: 网费充值
              proModelUrl: net
              type: "0"
            - id: 7
              projectName: 供暖费
              proModelUrl: heating
              type: "0"
            - projectName: no id
  - match: getProjectTypeAndProjectInfoList/f-more
    campus: cwpay
    body:
      messageCode: "0"
      message: 成功
      data:
        - id: p-x
          projectName: 会议费
          proModelUrl: meeting
          type: "0"
