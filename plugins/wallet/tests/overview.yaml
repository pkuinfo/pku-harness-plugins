  card:
    balance: 123.45
    name: 张三
    status: normal
    todaySpent: 12.5
    dailyLimit: 200
    expires: "20300701"
    low: false
  cardError: null
  netfee: null
  netfeeError: 没能读到网费信息，页面结构可能变了
  bath:
    available: false
    cardNo: null
    holder: null
    recentTopUps: []
    note: 收费平台目前没有为你的账号开放浴卡充值（项目列表里没有这一项）
    balance: null
