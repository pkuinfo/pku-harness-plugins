# The card info call fails with the platform’s message. (expected: the TypeScript tool on the same responses)
tool: bathCard
responses:
  - match: getProjectTypeAndProjectInfoListInit/10001
    campus: cwpay
    file: cwpay-projects.json
  - match: getProjectTypeAndProjectInfoList/f-more
    campus: cwpay
    body:
      messageCode: "0"
      message: 成功
      data: []
  - match: queryBathFeeInfo
    campus: cwpay
    file: cwpay-error.json
  - match: pageOrderlist
    campus: cwpay
    file: cwpay-orders.json
expectError: 收费平台：服务异常，请稍后再试（浴卡信息）
