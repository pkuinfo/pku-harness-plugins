# 数字卡 → NFC卡 by name (the restore path after cardSetDigital), then the card centre's rule as it
# stands after the switch, re-read through cardMode.
tool: cardSetMode
input:
  mode: NFC卡
responses:
  - match: useCard/getUseCardConfig
    campus: card
    body:
      code: 200
      success: true
      data:
        cardType: "1"
        cardTypes: &a1
          - name: 校园卡
            code: 0
          - name: 数字卡
            code: 1
          - name: NFC卡
            code: 2
  - match: useCard/setUseCardConfig
    campus: card
    body:
      code: 200
      success: true
      data: null
  - match: useCard/getUseCardConfig
    campus: card
    body:
      code: 200
      success: true
      data:
        cardType: "2"
        cardTypes: *a1
  - match: ykt/tsm/queryCard
    campus: card
    body:
      code: 200
      success: true
      data:
        card:
          - sno: "2000012345"
            name: 张三
            account: "123456"
            lostflag: 0
            freezeflag: 0
            expdate: "20300701"
            elec_accamt: 12345
            accinfo:
              - balance: 12345
                name: 电子钱包
                type: "001"
                daycostamt: 1250
                daycostlimit: 20000
  - match: cardConflict/getConflictInfo?fromaccount=123456&flag=1
    campus: card
    body:
      code: 200
      success: true
      data:
        status: "0"
        message: <p>您今天已经选择了使用NFC卡，数字卡已无法使用。 如确需变更当日用卡方式，可点击"常用卡设置"修改当前用卡方式，或者本人持校园卡及绑定手机，到校园卡中心人工窗口办理相关手续。</p>
expect:
  changed: true
  from: 数字卡
  mode: NFC卡
  notice: 您今天已经选择了使用NFC卡，数字卡已无法使用。 如确需变更当日用卡方式，可点击"常用卡设置"修改当前用卡方式，或者本人持校园卡及绑定手机，到校园卡中心人工窗口办理相关手续。
