# The service refuses the switch.
tool: cardSetMode
input: { mode: 校园卡 }
responses:
  - match: useCard/getUseCardConfig
    campus: card
    body:
      code: 200
      success: true
      data:
        cardType: "1"
        cardTypes:
          - name: 校园卡
            code: 0
          - name: 数字卡
            code: 1
          - name: NFC卡
            code: 2
  - match: useCard/setUseCardConfig
    campus: card
    body:
      code: 500
      success: false
      msg: 当前卡状态不允许切换
expectError: 切换用卡方式失败：当前卡状态不允许切换
