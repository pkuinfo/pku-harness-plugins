# The user typed the SMS code for a pending course check (method defaults to sms).
tool: gpa
input: { code: "123456" }
kv: { 'verify:pending': course }
responses:
  - { match: /chapi/api/course/mobile_message_get_token, campus: treehole, body: { code: 20000, success: true } }
  - { match: /chapi/api/course/score_v2, campus: treehole, file: score.json, headers: { content-type: application/json } }
expect: {"status":"ok","overallGpa":3.712,"totalCredits":13.5,"semesters":[{"semester":"24-25-1","label":"24-25学年度1学期","gpa":3.801,"credits":7,"courseCount":2},{"semester":"24-25-2","label":"24-25学年度2学期","gpa":3.65,"credits":4.5,"courseCount":2},{"semester":"24-25-3","label":"24-25学年度3学期","gpa":null,"credits":2,"courseCount":1}]}
