# verify.rs handle_sms_verification / api.rs course_token_exchange_with_sms, as the host's
# verify.treeholeSendCode ability (sends for whichever check the last call left pending).
title: 发送验证码
description: Send the SMS code that the last grades call asked for (to the phone bound to the account).
effect: write
steps:
  - let: r
    ability: verify.treeholeSendCode
    # Grades' second factor is the course token unless a login check is pending.
    args: "{ kind: 'course' }"
return: "{ sent: r.message }"
