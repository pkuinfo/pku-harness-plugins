name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # typecheck, registry, bundled documents up to date
      - run: bun run check
      # SDK, TS plugins, and every PLUGIN.md's recorded tests (plugins/documents.test.ts)
      - run: bun test
