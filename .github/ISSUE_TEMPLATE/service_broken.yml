name: A campus service broke
description: A plugin can't connect, returns wrong data, or a university site changed.
labels: [service-broken]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real account names, passwords, cookies, tokens, student IDs or personal data.** Redact screenshots.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - wallet (campus card, network fee, utilities)
        - finance
        - courses (Blackboard)
        - course-sync (timetable from the dean's office)
        - course-catalog
        - grades
        - elective
        - treehole
        - library
        - room-booking
        - classrooms
        - canteen
        - shuttle
        - notices
        - campus-events
        - calendar
        - authenticator
        - card-share
        - Other
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool or feature
      placeholder: e.g. treehole.read, wallet.cardRecharge, the canteen widget
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The exact error shown in the app, when it started, and what you expected.
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [Campus network, Outside campus, Not sure]
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.0.0 (Settings → About)
  - type: textarea
    id: notes
    attributes:
      label: Other clues
      description: Did the university site change? Does it work in a browser? Does pkucli work?
