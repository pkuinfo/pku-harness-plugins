name: New plugin proposal
description: Connect a new campus service, or add a new capability.
labels: [plugin-proposal]
body:
  - type: input
    id: service
    attributes:
      label: Service
      placeholder: e.g. Library seat reservation (seat.lib.pku.edu.cn)
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: Use cases
      description: What would students ask the AI? What should appear on the dashboard or in the schedule?
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Proposed tools
      description: For each tool, what it does and its effect (read / write / money / public).
  - type: textarea
    id: access
    attributes:
      label: Access needed
      description: Campus services (signed-in session), public hosts and app abilities the plugin would declare.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Plugin document (PLUGIN.md)
        - Remote plugin (MCP server)
        - TypeScript (needs a new host ability; please explain why)
        - Not sure yet
  - type: checkboxes
    id: rules
    attributes:
      label: Confirmation
      options:
        - label: The plugin never needs the user's campus password (credentials stay on the phone).
          required: true
        - label: I have read the plugin rules in CONTRIBUTING.md.
          required: true
