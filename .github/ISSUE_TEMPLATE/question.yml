name: Question
description: Not sure how something works? Please ask in Discussions instead
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        **Questions are answered faster in [GitHub Discussions → Q&A](https://github.com/pkuinfo/pku-harness/discussions/categories/q-a)**, where other plugin authors can find the answer later. The [plugin docs](https://harness.novadiffusion.com/en/docs/build) cover the language, testing and publishing.
        Use this form only if Discussions doesn't work for you.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do and what you have tried. No personal data, please.
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Relevant PLUGIN.md / tool YAML (optional)
      render: yaml
