name: SDK and plugin development
description: Questions or proposals about the plugin language, the SDK, host abilities, the registry or the remote plugin template.
labels: [sdk]
body:
  - type: textarea
    id: what
    attributes:
      label: Question or proposal
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Code and context
      description: The relevant PLUGIN.md / tool YAML / TypeScript snippet and any error message.
      render: yaml
